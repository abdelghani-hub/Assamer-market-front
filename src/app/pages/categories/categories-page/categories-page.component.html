<div class="container pt-5 px-3 md:px-8 dark:bg-gray-800 min-h-screen w-full">
  <!-- Categories header -->
  <div class="relative mb-5">
    <div #categoriesHeader id="categories_header"
         class="flex items-center flex-nowrap overflow-x-scroll scrollbar-hide">
      <button id="prev" aria-label="slide backward" (click)="slidePrev()"
              class="hidden absolute z-30 focus:outline-none  p-3 rounded-full bg-gray-400 bg-opacity-50 dark:bg-gray-500 dark:bg-opacity-55">
        <svg class="dark:text-gray-900" width="10" height="10" viewBox="0 0 8 14" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>

      @for (cat of categories; track cat.name) {
        <a [routerLink]="['/categories', cat.name]"
           [class.bg-green-800]="isCategoryActive(cat)"
           [class.text-white]="isCategoryActive(cat)"
           [class.hover:bg-gray-200]="!isCategoryActive(cat)"
           [class.dark:hover:text-gray-800]="!isCategoryActive(cat)"
           class="px-3 py-2 mx-2 rounded-full text-nowrap border border-gray-300 dark:text-gray-300">
          {{ cat.name }}
        </a>
      }

      <button id="next" aria-label="slide backward" (click)="slideNext()"
              class="rotate-180 -right-0 absolute z-30 focus:outline-none  p-3 rounded-full bg-gray-400 bg-opacity-50 dark:bg-gray-500 dark:bg-opacity-55">
        <svg class="dark:text-gray-900" width="10" height="10" viewBox="0 0 8 14" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Category products -->
  <div>
    <div id="place_result" class="flex flex-wrap px-2 md:px-6 gap-2 pb-10 pt-2 justify-center w-full">
      @if (loading) {
        <div class="h-[70vh] flex items-center">
          <span class="text-center text-2xl dark:text-green-200">
            Loading
            <span role="status">
              <svg aria-hidden="true"
                   class="inline w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-green-500"
                   viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                    fill="currentColor"/>
                  <path
                    d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                    fill="currentFill"/>
              </svg>
              <span class="sr-only">Loading...</span>
            </span>
          </span>
        </div>
      } @else if (products.length > 0) {
        @for (product of products; track product.id) {
          <app-product-card [product]="product"
                            class="hover:scale-[101%] bg-white dark:bg-slate-800 m-2 rounded-lg overflow-hidden shadow-lg ring-2 hover:ring-4 ring-green-500 ring-opacity-70 max-w-sm w-full md:w-[30%] flex flex-col justify-between "
          ></app-product-card>
        }
      } @else {
        <div class="h-[70vh] flex items-center">
          <h2 class="text-center text-2xl dark:text-green-200">No product found</h2>
        </div>
      }
    </div>
  </div>
</div>
