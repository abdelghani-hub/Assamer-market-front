<section *ngIf="hasProduct" class="py-8 bg-white md:py-16 dark:bg-gray-800 h-screen">
  <div class="px-4 mx-auto 2xl:px-0 h-full">
    <div class="lg:grid lg:grid-cols-2 lg:gap-8 xl:gap-16">
      <!-- Product Images Carousel -->
      <div class="shrink-0 w-full">
        <div id="product-carousel" class="relative w-full">
          <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
            <!-- Display all images in the carousel -->
            <ng-container *ngIf="product && productImages && productImages.length > 0">
              <div *ngFor="let src of productImages; let i = index"
                   [ngClass]="{'hidden': currentSlide !== i}"
                   class="duration-700 ease-in-out"
                   data-carousel-item>
                <img [src]="src"
                     class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                     alt="Product image">
              </div>
            </ng-container>

            <!-- No images placeholder -->
            <div *ngIf="!productImages || productImages.length === 0"
                 class="flex items-center justify-center h-full bg-gray-200 dark:bg-gray-700">
              <span class="text-gray-500 dark:text-gray-400">No images available</span>
            </div>
          </div>

          <!-- Slider indicators -->
          <div *ngIf="product && productImages && productImages.length > 0"
               class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
            <ng-container *ngFor="let photo of productImages; let i = index">
              <button type="button"
                      class="w-3 h-3 rounded-full"
                      [ngClass]="{'bg-blue-600': currentSlide === i, 'bg-gray-300': currentSlide !== i}"
                      (click)="goToSlide(i)">
              </button>
            </ng-container>
          </div>

          <!-- Slider controls - only show if there are images -->
          <ng-container *ngIf="productImages && productImages.length > 0">
            <button type="button"
                    class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    (click)="prevSlide()">
        <span
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
          <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" d="M5 1 1 5l4 4"/>
          </svg>
          <span class="sr-only">Previous</span>
        </span>
            </button>
            <button type="button"
                    class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    (click)="nextSlide()">
        <span
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
          <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" d="m1 9 4-4-4-4"/>
          </svg>
          <span class="sr-only">Next</span>
        </span>
            </button>
          </ng-container>
        </div>
      </div>

      <!-- Product Details -->
      <div class="mt-6 sm:mt-8 lg:mt-0">
        <!-- Product Name -->
        <h1 *ngIf="product" class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">
          {{ product.name }}
        </h1>

        <div *ngIf="product" class="mt-4 sm:items-center sm:gap-4 sm:flex">
          <!-- Price -->
          <p class="text-2xl font-extrabold text-gray-900 sm:text-3xl dark:text-white">
            {{ product.price }} MAD
          </p>

          <!-- Rating -->
          <div class="flex items-center gap-2 mt-2 sm:mt-0">
            <div class="flex items-center gap-1">
              <svg *ngFor="let i of [1,2,3,4,5]" class="w-4 h-4 text-yellow-300" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                   viewBox="0 0 24 24">
                <path
                  d="M13.849 4.22c-.684-1.626-3.014-1.626-3.698 0L8.397 8.387l-4.552.361c-1.775.14-2.495 2.331-1.142 3.477l3.468 2.937-1.06 4.392c-.413 1.713 1.472 3.067 2.992 2.149L12 19.35l3.897 2.354c1.52.918 3.405-.436 2.992-2.15l-1.06-4.39 3.468-2.938c1.353-1.146.633-3.336-1.142-3.477l-4.552-.36-1.754-4.17Z"/>
              </svg>
            </div>
            <p class="text-sm font-medium leading-none text-gray-500 dark:text-gray-400">
              (5.0)
            </p>
            <a href="#"
               class="text-sm font-medium leading-none text-gray-900 underline hover:no-underline dark:text-white">
              345 Reviews
            </a>
          </div>
        </div>

        <!-- Available Units -->
        <div *ngIf="product" class="flex dark:text-gray-300 py-2">
          <small class="mr-1">{{ product.quantity }}</small>
          <small> units available</small>
        </div>

        <!-- Category -->
        <div *ngIf="product && product.categoryName" class="flex mb-3">
          <a [routerLink]="['/categories', product.categoryName]"
             class="font-medium bg-gray-200 text-gray-400 dark:bg-gray-600 p-1 rounded-md">
            {{ product.categoryName }}
          </a>
        </div>

        <!-- Action Buttons -->
        <div class="md:py-4 flex gap-2 w-full">
          <!-- Add/Remove from Favorites -->
          <!--            (click)="removeFromFavorites()"-->
          <button
            *ngIf="isFavorite"
            class="items-center justify-center text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700 flex py-2.5 px-3 md:px-5">
            <svg class="fill-pink-600 w-5 h-5 -ms-2 me-2" aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                 viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 6.002C6.5 1 1 8 5.782 13.001L12 19l6.23-5.999C23 8 17.5 1 12 6.002Z"/>
            </svg>
            <span *ngIf="!isRemovingFromFavorites">Unwishlist</span>
            <span *ngIf="isRemovingFromFavorites">
              <svg aria-hidden="true" class="w-5 h-5 text-gray-200 animate-spin dark:text-gray-600 fill-green-600"
                   viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor"/>
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill"/>
              </svg>
            </span>
          </button>

          <!--                  (click)="addToFavorites()"-->
          <button *ngIf="!isFavorite"
                  class="cursor-pointer items-center justify-center text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700 flex py-2.5 px-3 md:px-5">
            <svg class="w-5 h-5 -ms-2 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"/>
            </svg>
            <span *ngIf="!isAddingToFavorites">Wishlist</span>
            <span *ngIf="isAddingToFavorites">
              <svg aria-hidden="true" class="w-5 h-5 text-gray-200 animate-spin dark:text-gray-600 fill-green-600"
                   viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor"/>
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill"/>
              </svg>
            </span>
          </button>

          <!-- Quantity Controls and Add to Cart -->
          <ng-container *ngIf="product && product.quantity > 0">
            <div class="flex quantity_div">
              <button (click)="decrementQuantity()"
                      class="cursor-pointer p-2 m-0 font-extrabold rounded-s-full border w-10 hover:bg-gray-200 dark:hover:bg-gray-600 text-center dark:text-gray-300">
                -
              </button>
              <input class="max-w-10 text-center p-0 m-0 dark:text-blue-300"
                     type="number"
                     [(ngModel)]="quantity"
                     [max]="product.quantity"
                     (change)="handleQuantityChange()"
                     min="1">
              <button (click)="incrementQuantity()"
                      class="cursor-pointer p-2 m-0 font-extrabold rounded-e-full border w-10 hover:bg-gray-200 dark:hover:bg-gray-600 text-center dark:text-gray-300">
                +
              </button>
            </div>

            <!--              (click)="addToCart()"-->
            <button
              class="cursor-pointer max-w-60 flex-grow text-white sm:mt-0 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800 flex items-center p-0 justify-center py-2.5 px-3 md:px-5">
              <svg *ngIf="!isAddingToCart" class="w-5 h-5 -ms-2 me-2" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                   fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4h1.5L8 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm.75-3H7.5M11 7H6.312M17 4v6m-3-3h6"/>
              </svg>
              <div *ngIf="isAddingToCart" role="status">
                <svg aria-hidden="true" class="w-5 h-5 text-gray-200 animate-spin dark:text-gray-600 fill-white"
                     viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                    fill="currentColor"/>
                  <path
                    d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                    fill="currentFill"/>
                </svg>
                <span class="sr-only">Loading...</span>
              </div>
              <span class="ml-2" *ngIf="!isAddingToCart">Add to cart</span>
              <span class="ml-2" *ngIf="isAddingToCart">Adding...</span>
            </button>
          </ng-container>

          <!-- Out of Stock Button -->
          <button *ngIf="product && product.quantity <= 0"
                  class="text-nowrap flex-grow text-gray-800 sm:mt-0 bg-gray-300 cursor-not-allowed focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm dark:bg-gray-600 dark:focus:ring-gray-700 flex items-center justify-center py-2.5 px-2 md:px-5">
            <svg class="w-5 h-5 -ms-2 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 4h1.5L8 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm.75-3H7.5M11 7H6.312M17 4v6m-3-3h6"/>
            </svg>
            Out of stock
          </button>
        </div>

        <hr class="my-6 md:my-8 border-gray-200 dark:border-gray-800"/>

        <!-- Product Description -->
        <p *ngIf="product" class="mb-6 text-gray-500 dark:text-gray-400">
          {{ product.description }}
        </p>
      </div>
    </div>
  </div>
</section>
