<header class="h-16 fixed w-full z-50 drop-shadow-lg bg-gray-200 dark:bg-green-950">
  <nav class="border-gray-200 px-2 md:px-4 lg:px-6 py-2.5 relative bg-green-950">
    <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl">

      <!-- Logo -->
      <app-logo/>

      <!-- Right Section -->
      <div class="flex items-center lg:order-2">

        <!-- Cart Button -->
        <span class="relative cursor-pointer mr-2" (click)="toggleCart()">
          <svg class="w-6 h-6 text-gray-700 dark:text-gray-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
               height="24" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd"
                  d="M4 4a1 1 0 0 1 1-1h1.5a1 1 0 0 1 .979.796L7.939 6H19a1 1 0 0 1 .979 1.204l-1.25 6a1 1 0 0 1-.979.796H9.605l.208 1H17a3 3 0 1 1-2.83 2h-2.34a3 3 0 1 1-4.009-1.76L5.686 5H5a1 1 0 0 1-1-1Z"
                  clip-rule="evenodd"/>
          </svg>
          <span *ngIf="(((cartProducts$ | async) ?? []).length > 0)" id="cartCount"
                class="absolute -top-3 right-0 w-4 h-4 bg-green-500 text-white text-xs rounded-full flex items-center justify-center">
            {{ (cartProducts$ | async)?.length }}
          </span>
        </span>

        <!-- Dark & Light Theme Toggle -->
        <app-theme-button/>

        <!-- User Authentication -->
        <ng-container *ngIf="user; else guestLinks">
          <!-- User Avatar & Dropdown -->
          <button type="button"
                  (click)="toggleUserDropdown($event)"
                  class=" flex items-center mx-2 text-sm rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
                  id="user-menu-button"
                  [attr.aria-expanded]="isUserDropdownOpen"
                  data-dropdown-toggle="dropdown">
            <img class="w-8 h-8 rounded-full" src="assets/images/default_user_photo.png" alt="User Photo"/>
            <span class="hidden md:block p-2 text-gray-700 dark:text-gray-300">{{ user.username }}</span>
          </button>

          <!-- Dropdown Menu -->
          <div [class.hidden]="!isUserDropdownOpen"
               class="absolute top-16 right-0 z-50 my-4 w-56 text-base list-none bg-white shadow divide-y divide-gray-100 dark:bg-gray-700 dark:divide-gray-600 rounded-xl"
               id="dropdown">
            <div class="py-3 px-4">
              <span class="block text-sm font-semibold text-gray-900 dark:text-white">{{ user.username }}</span>
              <span class="block text-sm text-gray-900 truncate dark:text-white">{{ user.email }}</span>
            </div>

            <ul class="py-1 text-gray-700 dark:text-gray-300">
              <li>
                <a routerLink="/profile" class="block py-2 px-4 text-sm hover:bg-green-200 dark:hover:bg-gray-600">Profile</a>
              </li>
              <li><a routerLink="/dashboard" *ngIf="role == 'ROLE_ADMIN'"
                     class="block py-2 px-4 text-sm hover:bg-green-200 dark:hover:bg-gray-600">Dashboard</a></li>
              <li><a routerLink="/seller/store" *ngIf="role == 'ROLE_SELLER'"
                     class="block py-2 px-4 text-sm hover:bg-green-200 dark:hover:bg-gray-600">My Store</a></li>
            </ul>

            <ng-container *ngIf="role == 'ROLE_CUSTOMER'">
              <ul class="p-2">
                <span *ngIf="user.sellerRequest?.status == 'pending'"
                      class="block py-2 px-4 text-sm text-center text-white bg-green-500 font-semibold rounded-md">
                  Seller Request Pending ...
                </span>
                <form *ngIf="!user.sellerRequest || user.sellerRequest.status !== 'pending'"
                      class="block rounded-md text-center text-white bg-green-500 hover:bg-green-600 font-semibold">
                  <button class="py-2 px-4 w-full">Become a Seller</button>
                </form>
              </ul>
            </ng-container>

            <ul class="py-1 text-gray-700 dark:text-gray-300">
              <li>
                <button (click)="logout()"
                        class="w-full flex gap-2 py-2 px-4 text-sm hover:bg-green-200 dark:hover:bg-gray-600  rounded-2xl">
                  <svg class="w-6 h-6 text-gray-800 dark:text-white rotate-180" aria-hidden="true"
                       xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                       viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"/>
                  </svg>
                  <span>Sign out</span>
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <!-- Guest Links -->
        <ng-template #guestLinks>
          <a routerLink="/auth/login"
             class="hidden md:block text-gray-800 dark:text-white hover:text-green-600 font-medium rounded-lg text-sm px-2 lg:px-5 py-2 lg:py-2.5">
            Login
          </a>
          <a routerLink="/auth/register"
             class="hidden md:block text-white bg-green-500 hover:bg-green-600 font-medium rounded-lg text-sm px-2 lg:px-5 py-2 lg:py-2.5">
            Register
          </a>
        </ng-template>

        <!-- Mobile Menu Button -->
        <button
          (click)="toggleMobileMenu($event)"
          data-collapse-toggle="navbar"
          type="button"
          [attr.aria-expanded]="isMobileMenuOpen"
          class=" inline-flex items-center p-2 justify-center text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:ring-2 focus:ring-gray-200">
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M1 1h15M1 7h15M1 13h15"/>
          </svg>
        </button>
      </div>

      <!-- Main Navigation -->
      <div
        id="navbar"
        [class.hidden]="!isMobileMenuOpen"
        class="hidden justify-between items-center w-full lg:flex lg:w-auto lg:order-1">
        <ul class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
          <ng-container *ngIf="!user">
            <li class="md:hidden flex w-full justify-around gap-3 mb-4">
              <a routerLink="/auth/login"
                 class="text-gray-800 dark:text-white hover:text-green-600 font-medium border border-green-200 px-3 py-2 rounded-lg">
                Login
              </a>
              <a routerLink="/auth/register"
                 class="text-white bg-green-500 hover:bg-green-600 font-medium px-3 py-2 rounded-lg">Register</a>
            </li>
          </ng-container>

          <li><a routerLink="/home"
                 routerLinkActive="text-green-500 font-bold"
                 class="block py-2 pr-4 pl-3  dark:text-gray-300 hover:text-green-500">Home</a></li>
          <li><a [routerLink]="['/categories', '']"
                 routerLinkActive="text-green-500 font-bold"
                 class="block py-2 pr-4 pl-3  dark:text-gray-300 hover:text-green-500">Categories</a>
          </li>
          <li><a routerLink="#"
                 routerLinkActive="text-green-500 font-bold"
                 class="block py-2 pr-4 pl-3  dark:text-gray-300 hover:text-green-500">Team</a></li>
          <li><a routerLink="#"
                 routerLinkActive="text-green-500 font-bold"
                 class="block py-2 pr-4 pl-3  dark:text-gray-300 hover:text-green-500">Contact</a></li>
        </ul>
      </div>
    </div>
    <app-cart *ngIf="isCartOpen" (closeCart)="isCartOpen = false"></app-cart>
  </nav>
</header>
<div class="w-full h-16"></div>
